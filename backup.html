<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Roleta do Sorteio Mensal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body { 
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            background: radial-gradient(circle at top, #810404, #0d0a1f 80%);
            display: flex;
            flex-direction: column;
            align-items: center; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        .logo-canto {
            position: absolute;
            top: 20px;
            left: 25px;
            width: 120px;
            opacity: 0.9;
            filter: drop-shadow(0 0 10px #00e6ff);
        }

        .banner-topo {
            width: 100%;
            max-width: 520px;
            margin-top: 50px; /* Reduzi a margem superior */
            margin-bottom: 50px; 
            filter: drop-shadow(0 0 15px rgba(0, 255, 200, 0.4)); /* Sombra para integrar melhor */
            /* Opcional: Remova o comentário da linha abaixo se quiser um box-shadow também */
            /* box-shadow: 0 0 30px rgba(0, 255, 200, 0.2); */ 
            border-radius: 15px; /* Bordas levemente arredondadas */
        }
        
        .roleta-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 1000px; 
        }
        
        .roleta-container {
            width: 1000px;
            margin: 0 auto; 
            border: 4px solid rgba(0, 255, 200, 0.3);
            border-radius: 20px;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,255,200,0.15);
        }

        /* --- Estilos da Lista de Itens (Sidebar) --- */
        .sidebar {
            width: 1000px; 
            max-height: 300px; 
            margin-top: 40px; 
            
            overflow-y: auto; 
            padding: 20px;
            border: 4px solid rgba(255, 100, 0, 0.3);
            border-radius: 20px;
            background: rgba(40, 20, 20, 0.7);
            box-shadow: 0 0 30px rgba(255,100,0,0.15);
        }

        .sidebar h3 {
            margin-top: 0;
            color: #ffaa00;
            text-shadow: 0 0 5px #ffcc00;
            border-bottom: 1px solid rgba(255, 100, 0, 0.5);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        #lista-itens {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }

        #lista-itens li {
            padding: 8px 0; 
            color: #ccc;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            cursor: pointer; 
            transition: color 0.2s;
        }

        #lista-itens li:hover {
            color: #00ffcc; 
        }

        #lista-itens li:last-child {
            border-bottom: none;
        }

        /* --- Div para Exibir Imagem do Item Selecionado (Dragável) --- */
        #item-selecionado-display {
            width: 300px; 
            min-height: 300px; 
            background: rgba(20, 20, 40, 0.9);
            border: 4px solid rgba(0, 255, 200, 0.5);
            border-radius: 20px;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            
            position: fixed; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centraliza na tela */
            z-index: 1000; 
            box-shadow: 0 0 40px rgba(0,255,200,0.3);
            opacity: 0; 
            visibility: hidden; 
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
            padding: 0; 
            box-sizing: content-box; 
        }
        
        #item-selecionado-display.dragging {
            cursor: grabbing;
            transition: none; /* Desativa transição ao arrastar */
        }

        #item-selecionado-display.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Estilo para a barra de título (Arrastável) */
        .drag-handle {
            width: 100%;
            height: 30px;
            background: linear-gradient(90deg, #00ffcc55, #00aaff55);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            cursor: grab;
            position: relative;
            text-align: center;
            line-height: 30px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            box-sizing: border-box;
            user-select: none; /* Impede seleção de texto ao arrastar */
        }
        
        .close-button {
            position: absolute;
            top: 0px; 
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ff4d4d; 
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            line-height: 30px; 
            background: none; 
            border: none;
            padding: 0;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);
            z-index: 1001;
        }

        .close-button:hover {
            color: #ff0000;
            transform: scale(1.1);
        }
        
        /* Conteúdo principal da imagem e nome */
        .display-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        #item-selecionado-img {
            max-width: 95%;
            max-height: 250px; 
            object-fit: contain; 
            border-radius: 10px;
        }

        #item-selecionado-nome { 
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffff;
            text-align: center;
        }


        .roleta {
            display: flex;
            transition: transform 12s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(0);
        }

        .item {
            min-width: 200px;
            height: 200px; 
            margin: 0 12px;
            background: linear-gradient(145deg, #242b45, #1b1f33);
            border-radius: 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #bfeaff;
            text-shadow: 0 0 4px #00d9ff;
            transition: 0.3s;
            transform: scale(1);
        }
        
        .item.highlight {
            background: linear-gradient(145deg, #00ffcc, #0088ff);
            box-shadow: 0 0 40px #00ffff, inset 0 0 10px #ffffff;
            color: #fff;
            transform: scale(1.15);
            z-index: 2;
        }

        .item img {
            max-width: 90%;
            max-height: 130px;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .roleta-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 40px solid #ffcc00;
            filter: drop-shadow(0 0 10px #ffcc00);
            z-index: 10;
        }

        #resultado {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffff;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        #botaoGirar {
            padding: 14px 30px;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        #botaoGirar {
            background: linear-gradient(90deg, #00ffcc, #00aaff);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px #00e6ff;
        }

        #botaoGirar:hover {
            background: linear-gradient(90deg, #00ccff, #00ffaa);
            box-shadow: 0 0 20px #00ffff;
        }

        footer {
            margin-top: 50px;
            color: #aaa;
            font-size: 14px;
            text-shadow: 0 0 5px #00ffff55;
        }

        footer a {
            color: #00ffff;
            text-decoration: none;
        }

        footer a:hover {
            text-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
